name: Feature request
description: Suggest a change. For open-ended ideas, start a discussion instead.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you'd like to happen
  - type: textarea
    id: alternatives
    attributes:
      label: What you've tried or considered
